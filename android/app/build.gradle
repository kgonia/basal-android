plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'io.github.kgonia.basal'
    compileSdk = 36

    defaultConfig {
        applicationId = 'io.github.kgonia.basal'
        minSdk = 29
        targetSdk = 36
        versionCode = 1
        versionName = '0.1'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    buildTypes {
        release {
            // For sideloading from GitHub Releases; the key is the debug key unless you sign it yourself.
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // NPU: the DSP loads the QNN Skel library from a file, and LiteRT looks for its dispatch library in a directory
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    testOptions {
        unitTests.all {
            systemProperty 'basal.tokenizer', System.getProperty('basal.tokenizer', 'D:/models/basal-2.0-mini-bf16/tokenizer.json')
        }
    }
}

dependencies {
    implementation 'com.google.ai.edge.litert:litert:2.3.0'
    // LiteRT's Qualcomm dispatch library; the QNN runtime it loads is in jniLibs
    implementation 'com.google.ai.edge.litert:litert-npu-runtime-qualcomm:2.3.0'
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    // Android's org.json is a stub in local unit tests
    testImplementation 'org.json:json:20250517'
    // keeps the key order of the test vectors (org.json's desktop JSONObject does not)
    testImplementation 'com.google.code.gson:gson:2.13.1'
}
